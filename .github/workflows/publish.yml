name: Publish
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - name: Install dependencies
        run: deno install --frozen
      - name: Format
        run: deno fmt --check
      - name: Lint
        run: deno lint
      - name: Type-check
        run: deno check mod.ts 'src/**/*.ts'
      - name: Doc lint
        run: deno doc --lint mod.ts
      - name: Test
        run: deno task test
      - name: Publish dry run
        run: deno publish --dry-run

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish package
        run: npx jsr publish
